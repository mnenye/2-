{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.6.0/css/all.css">
</head>
<body>
    <aside>

        <span class="logo">Сортировка выбором</span>
        <h3>Навигация</h3>
        <ul>
            <a href="{% url 'solve_sort' %}"><li><i class="fa-solid fa-hand" style="color:  #292f46;"></i>Ручной ввод массива для сортировки</li></a>
            <a href="{% url 'random_sort' %}"><li><i class="fa-solid fa-shuffle" style="color: #292f46;"></i>Сортировка случайно созданного массива</li></a>
            <a href="{% url 'home' %}"><li><i class="fa-solid fa-address-book" style="color: #292f46;"></i>Справка</li></a>
            <a href="{% url 'history' %}"><li><i class="fa-solid fa-book" style="color: #292f46;"></i>История</li></a>
        </ul>
    </aside>
    <main>
    {% block content %}
    {% endblock %}
    </main>
</body>
</html>
